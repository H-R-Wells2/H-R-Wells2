<svg
  width="900"
  height="300"
  viewBox="0 0 900 300"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- HRWells brand gradient -->
    <linearGradient
      id="hrwellsGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%"   stop-color="#F5B800"/>
      <stop offset="45%"  stop-color="#E7A900"/>
      <stop offset="75%"  stop-color="#B89B3E"/>
      <stop offset="100%" stop-color="#687044"/>
    </linearGradient>

    <!-- Subtle amber glow -->
    <filter
      id="amberGlow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur
        stdDeviation="4"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->
  <rect
    width="900"
    height="300"
    rx="12"
    fill="#080909"
  />


  <!-- Outer terminal-style border -->
  <rect
    x="12"
    y="12"
    width="876"
    height="276"
    rx="8"
    fill="none"
    stroke="#29291F"
    stroke-width="2"
  />


  <!-- Small terminal indicator -->
  <circle
    cx="38"
    cy="38"
    r="4"
    fill="#F5B800"
  />

  <text
    x="52"
    y="42"
    font-family="monospace"
    font-size="12"
    letter-spacing="2"
    fill="#6F6B52"
  >
    HRWELLS.DEV
  </text>


  <!-- Main Brand -->
  <text
    x="450"
    y="135"
    text-anchor="middle"
    font-family="monospace"
    font-size="86"
    font-weight="900"
    letter-spacing="-3"
    fill="url(#hrwellsGradient)"
    filter="url(#amberGlow)"
  >
    HRWells
  </text>


  <!-- Accent line -->
  <line
    x1="220"
    y1="162"
    x2="680"
    y2="162"
    stroke="#302D1B"
    stroke-width="1"
  />

  <circle
    cx="220"
    cy="162"
    r="2"
    fill="#F5B800"
  />

  <circle
    cx="680"
    cy="162"
    r="2"
    fill="#687044"
  />


  <!-- Tagline -->
  <text
    x="450"
    y="202"
    text-anchor="middle"
    font-family="monospace"
    font-size="17"
    letter-spacing="0.5"
    fill="#B8B39C"
  >
    Building products • Building systems • Building
  </text>

  <text
    x="450"
    y="230"
    text-anchor="middle"
    font-family="monospace"
    font-size="17"
    letter-spacing="0.5"
    fill="#B8B39C"
  >
    things that actually ship.
  </text>


  <!-- Bottom terminal prompt -->
  <text
    x="38"
    y="267"
    font-family="monospace"
    font-size="12"
    fill="#4E5038"
  >
    $
  </text>

  <text
    x="52"
    y="267"
    font-family="monospace"
    font-size="12"
    fill="#77745E"
  >
    ./build --ship
  </text>

  <text
    x="160"
    y="267"
    font-family="monospace"
    font-size="12"
    fill="#F5B800"
  >
    ✓
  </text>

</svg>