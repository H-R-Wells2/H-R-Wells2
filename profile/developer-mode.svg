<svg
  width="1000"
  height="560"
  viewBox="0 0 1000 560"
  xmlns="http://www.w3.org/2000/svg"
>

  <defs>

    <!-- HRWells brand gradient -->
    <linearGradient
      id="brandGradient"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" stop-color="#F5B800"/>
      <stop offset="55%" stop-color="#D6A600"/>
      <stop offset="100%" stop-color="#687044"/>
    </linearGradient>

    <!-- Terminal background -->
    <linearGradient
      id="terminalBackground"
      x1="0%"
      y1="0%"
      x2="0%"
      y2="100%"
    >
      <stop offset="0%" stop-color="#0B0C0A"/>
      <stop offset="100%" stop-color="#080909"/>
    </linearGradient>

    <!-- Subtle grid -->
    <pattern
      id="grid"
      width="40"
      height="40"
      patternUnits="userSpaceOnUse"
    >
      <path
        d="M 40 0 L 0 0 0 40"
        fill="none"
        stroke="#F5B800"
        stroke-opacity="0.025"
        stroke-width="1"
      />
    </pattern>

    <!-- Glow -->
    <filter
      id="amberGlow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur
        stdDeviation="3"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter
      id="greenGlow"
      x="-30%"
      y="-30%"
      width="160%"
      height="160%"
    >
      <feGaussianBlur
        stdDeviation="2"
        result="blur"
      />

      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip scanline inside terminal -->
    <clipPath id="terminalClip">
      <rect
        x="21"
        y="21"
        width="958"
        height="518"
        rx="13"
      />
    </clipPath>

  </defs>


  <!-- ================================================= -->
  <!-- TERMINAL -->
  <!-- ================================================= -->

  <rect
    x="20"
    y="20"
    width="960"
    height="520"
    rx="14"
    fill="url(#terminalBackground)"
    stroke="#29291F"
    stroke-width="2"
  />

  <rect
    x="21"
    y="21"
    width="958"
    height="518"
    rx="13"
    fill="url(#grid)"
  />


  <!-- ================================================= -->
  <!-- ANIMATED SCANLINE -->
  <!-- ================================================= -->

  <g clip-path="url(#terminalClip)">

    <rect
      x="21"
      y="85"
      width="958"
      height="1"
      fill="#F5B800"
      opacity="0"
    >
      <animate
        attributeName="y"
        values="85;525;85"
        dur="7s"
        repeatCount="indefinite"
      />

      <animate
        attributeName="opacity"
        values="0;0.08;0"
        dur="7s"
        repeatCount="indefinite"
      />
    </rect>

  </g>


  <!-- ================================================= -->
  <!-- TITLE BAR -->
  <!-- ================================================= -->

  <rect
    x="21"
    y="21"
    width="958"
    height="55"
    rx="13"
    fill="#0D0E0C"
  />

  <line
    x1="21"
    y1="76"
    x2="979"
    y2="76"
    stroke="#29291F"
    stroke-width="1"
  />


  <!-- Window buttons -->

  <circle
    cx="50"
    cy="48"
    r="6"
    fill="#A43B32"
  />

  <circle
    cx="70"
    cy="48"
    r="6"
    fill="#A87916"
  />

  <circle
    cx="90"
    cy="48"
    r="6"
    fill="#477044"
  />


  <!-- Terminal title -->

  <text
    x="500"
    y="53"
    text-anchor="middle"
    font-family="monospace"
    font-size="13"
    letter-spacing="2"
    fill="#77745E"
  >
    HRWELLS // DEVELOPER MODE
  </text>


  <!-- ================================================= -->
  <!-- LIVE INDICATOR -->
  <!-- ================================================= -->

  <circle
    cx="925"
    cy="48"
    r="4"
    fill="#6E9B54"
  >

    <animate
      attributeName="opacity"
      values="1;0.35;1"
      dur="1.8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="r"
      values="4;5;4"
      dur="1.8s"
      repeatCount="indefinite"
    />

  </circle>

  <text
    x="938"
    y="52"
    font-family="monospace"
    font-size="11"
    fill="#687044"
  >
    LIVE
  </text>


  <!-- ================================================= -->
  <!-- GIT STATUS -->
  <!-- ================================================= -->

  <text
    x="60"
    y="115"
    font-family="monospace"
    font-size="16"
    font-weight="bold"
    fill="#F5B800"
  >
    $
  </text>

  <text
    x="80"
    y="115"
    font-family="monospace"
    font-size="16"
    fill="#D6D0B8"
  >
    git status
  </text>


  <!-- Branch -->

  <text
    x="60"
    y="150"
    font-family="monospace"
    font-size="14"
    fill="#B8B39C"
  >
    On branch
  </text>

  <text
    x="155"
    y="150"
    font-family="monospace"
    font-size="14"
    fill="#F5B800"
  >
    main
  </text>


  <!-- Origin -->

  <text
  x="60"
  y="177"
  font-family="monospace"
  font-size="14"
  >
    <tspan fill="#77745E">Your branch is up to date with </tspan>
    <tspan fill="#687044">'origin'</tspan>
  </text>



  <!-- Changes -->

  <text
    x="60"
    y="218"
    font-family="monospace"
    font-size="14"
    fill="#A79F82"
  >
    Changes not staged for commit:
  </text>


  <!-- ideas.md -->

  <text
    x="85"
    y="250"
    font-family="monospace"
    font-size="14"
    fill="#5F8A4C"
  >
    modified:
  </text>

  <text
    x="185"
    y="250"
    font-family="monospace"
    font-size="14"
    fill="#C5BEA5"
  >
    ideas.md
  </text>


  <!-- projects.md -->

  <text
    x="85"
    y="278"
    font-family="monospace"
    font-size="14"
    fill="#5F8A4C"
  >
    modified:
  </text>

  <text
    x="185"
    y="278"
    font-family="monospace"
    font-size="14"
    fill="#C5BEA5"
  >
    projects.md
  </text>


  <!-- sleep.schedule -->

  <text
    x="85"
    y="306"
    font-family="monospace"
    font-size="14"
    fill="#5F8A4C"
  >
    modified:
  </text>

  <text
    x="185"
    y="306"
    font-family="monospace"
    font-size="14"
    fill="#C5BEA5"
  >
    sleep.schedule
  </text>


  <!-- ================================================= -->
  <!-- COMMANDS -->
  <!-- ================================================= -->

  <text
    x="60"
    y="355"
    font-family="monospace"
    font-size="15"
    fill="#F5B800"
  >
    $
  </text>

  <text
    x="80"
    y="355"
    font-family="monospace"
    font-size="15"
    fill="#D6D0B8"
  >
    git add .
  </text>


  <text
    x="60"
    y="385"
    font-family="monospace"
    font-size="15"
    fill="#F5B800"
  >
    $
  </text>

  <text
    x="80"
    y="385"
    font-family="monospace"
    font-size="15"
    fill="#D6D0B8"
  >
    git commit -m
  </text>

  <text
    x="230"
    y="385"
    font-family="monospace"
    font-size="15"
    fill="#687044"
  >
    "another idea at 2AM"
  </text>


  <text
    x="60"
    y="415"
    font-family="monospace"
    font-size="15"
    fill="#F5B800"
  >
    $
  </text>

  <text
    x="80"
    y="415"
    font-family="monospace"
    font-size="15"
    fill="#D6D0B8"
  >
    git push
  </text>


  <!-- ================================================= -->
  <!-- DIVIDER -->
  <!-- ================================================= -->

  <line
    x1="60"
    y1="440"
    x2="940"
    y2="440"
    stroke="#29291F"
    stroke-width="1"
  />


  <!-- ================================================= -->
  <!-- SUCCESS MESSAGE -->
  <!-- ================================================= -->

  <circle
    cx="70"
    cy="475"
    r="5"
    fill="#6E9B54"
  >

    <animate
      attributeName="opacity"
      values="1;0.45;1"
      dur="2.2s"
      repeatCount="indefinite"
    />

  </circle>


  <text
    x="88"
    y="480"
    font-family="monospace"
    font-size="17"
    font-weight="bold"
    fill="#B8B39C"
  >

    Everything shipped.

    <animate
      attributeName="opacity"
      values="1;0.65;1"
      dur="3s"
      repeatCount="indefinite"
    />

  </text>


  <!-- ================================================= -->
  <!-- DEPLOY STATUS -->
  <!-- ================================================= -->

  <text
    x="60"
    y="510"
    font-family="monospace"
    font-size="11"
    fill="#4E5038"
  >
    deploy.status
  </text>

  <text
    x="160"
    y="510"
    font-family="monospace"
    font-size="11"
    fill="#687044"
  >
    ✓ production
  </text>

  <text
    x="290"
    y="510"
    font-family="monospace"
    font-size="11"
    fill="#4E5038"
  >
    •
  </text>

  <text
    x="305"
    y="510"
    font-family="monospace"
    font-size="11"
    fill="#687044"
  >
    2.4s
  </text>


  <!-- ================================================= -->
  <!-- ANIMATED CURSOR -->
  <!-- ================================================= -->

  <rect
    x="360"
    y="499"
    width="7"
    height="14"
    fill="#F5B800"
  >

    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="0.9s"
      repeatCount="indefinite"
    />

  </rect>


  <!-- ================================================= -->
  <!-- DEPLOYMENT ACTIVITY -->
  <!-- ================================================= -->

  <rect
    x="760"
    y="503"
    width="150"
    height="2"
    rx="1"
    fill="#29291F"
  />

  <rect
    x="760"
    y="503"
    width="35"
    height="2"
    rx="1"
    fill="url(#brandGradient)"
  >

    <animate
      attributeName="x"
      values="760;875;760"
      dur="3s"
      repeatCount="indefinite"
    />

  </rect>

</svg>