name: Update Profile Stats

on:
  schedule:
    - cron: "0 0 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ─────────────────────────────────────────────
      # Checkout
      # ─────────────────────────────────────────────

      - name: Checkout repository
        uses: actions/checkout@v6


      # ─────────────────────────────────────────────
      # GitHub Stats
      # ─────────────────────────────────────────────

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats

          options: >-
            username=${{ github.repository_owner }}&
            theme=dark&
            show_icons=true&
            include_all_commits=true&
            hide_border=true&
            bg_color=0D1117&
            title_color=FFFFFF&
            text_color=8B949E&
            icon_color=F0C14B&
            ring_color=F0C14B&
            border_radius=10

          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # ─────────────────────────────────────────────
      # Most Used Languages
      # ─────────────────────────────────────────────

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs

          options: >-
            username=${{ github.repository_owner }}&
            theme=dark&
            layout=compact&
            langs_count=8&
            hide_border=true&
            bg_color=0D1117&
            title_color=FFFFFF&
            text_color=8B949E&
            border_radius=10

          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # ─────────────────────────────────────────────
      # GitHub Streak
      # ─────────────────────────────────────────────

      - name: Generate GitHub Streak
        uses: zients/github-readme-streak-stats@v2
        with:
          options: >-
            user=${{ github.repository_owner }}&
            background=0D1117&
            border=0D1117&
            stroke=30363D&
            ring=F0C14B&
            fire=F0C14B&
            currStreakNum=FFFFFF&
            sideNums=FFFFFF&
            currStreakLabel=F0C14B&
            sideLabels=8B949E&
            dates=8B949E&
            hide_border=true&
            card_width=495&
            card_height=195&
            disable_animations=true

          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}


      # ─────────────────────────────────────────────
      # Contribution Snake
      # ─────────────────────────────────────────────

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            profile/github-snake.svg?color_snake=%23F0C14B&color_dots=%23EBEDF0,%23FFF3BF,%23FFE082,%23F0C14B,%23D4A017
            profile/github-snake-dark.svg?color_snake=%23F0C14B&color_dots=%23161B22,%23332A10,%236B5318,%23B8860B,%23F0C14B

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      # ─────────────────────────────────────────────
      # Commit generated files
      # ─────────────────────────────────────────────

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update profile assets"
            git push
          fi